services:
  postgres:
    image: postgres:16-alpine
    container_name: tajwid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tajwid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mengaji}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - tajwid_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tajwid} -d ${POSTGRES_DB:-mengaji}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tajwid-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-tajwid}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-mengaji}
      DATABASE_SSL: "false"
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      NEXTAUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://tajwidku.teknik.unismuh.ac.id}
      AUTH_TRUST_HOST: "true"
      CAMPUS_GRAPHQL_URL: ${CAMPUS_GRAPHQL_URL:-https://sicekcok.if.unismuh.ac.id/graphql}
      CERTIFICATE_API_KEY: ${CERTIFICATE_API_KEY:?Set CERTIFICATE_API_KEY in .env}
      PAYMENT_PROOF_DIR: /app/data/payment-proofs
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator Sistem}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tajwid.local}
    ports:
      - "${APP_PORT:-3015}:3015"
    volumes:
      - tajwid_payment_proofs:/app/data/payment-proofs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3015/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s

volumes:
  tajwid_postgres_data:
    driver: local
  tajwid_payment_proofs:
    driver: local
