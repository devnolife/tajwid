name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder
      DATABASE_SSL: "false"
      AUTH_SECRET: ci-only-auth-secret-with-at-least-32-characters
      NEXTAUTH_SECRET: ci-only-auth-secret-with-at-least-32-characters
      CERTIFICATE_API_KEY: ci-only-certificate-key-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
